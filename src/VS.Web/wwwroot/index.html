<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VITEC Soccer Scoreboard</title>
  <link rel="stylesheet" href="/site.css?v=0.2.6" />
</head>
<body>
  <header class="app-header">
    <div><div class="brand-title-row"><img src="/images/vitec-logo.png" alt="VITEC" /><h1>VITEC Soccer Scoreboard</h1></div><p>VS · MLS Live Scoreboard v0.2.6</p></div>
    <div class="header-actions"><input id="matchDate" type="date" /><a href="/standings.html">Standings</a><a href="/history.html">History</a><a href="/setup.html">Settings</a><button id="refresh" type="button">Refresh</button></div>
  </header>
  <main class="page-shell">
    <div class="section-heading-row"><h2 id="matchCount">MLS matches</h2><span id="updated" class="muted"></span></div>
    <section id="matches" class="scoreboard-grid" aria-live="polite"></section>
    <section class="leaders-section"><div class="section-heading-row"><h2>Daily Leaders and Match Alerts</h2><span id="summaryUpdated" class="muted">Loading MLS leaders…</span></div>
      <div class="daily-leaders-grid"><article class="panel"><h3>Goals</h3><div id="goalLeaders" class="leader-list"></div></article><article class="panel"><h3>Shots</h3><div id="shotLeaders" class="leader-list"></div></article><article class="panel"><h3>Expected Goals</h3><div id="xgLeaders" class="leader-list"></div></article><article class="panel"><h3>Match Alerts</h3><div id="matchAlerts" class="leader-list"></div></article></div>
    </section>
  </main>
  <script src="/soccer.js?v=0.2.6"></script>
</body>
</html>
