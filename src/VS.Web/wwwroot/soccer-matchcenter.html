<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VITEC Soccer MatchCenter</title>
  <link rel="stylesheet" href="/site.css?v=0.1.2">
</head>
<body>
  <header class="app-header">
    <div><div class="brand-title-row"><img src="/images/vitec-logo.png" alt="VITEC"><h1>VITEC Soccer MatchCenter</h1></div><p>Live match details</p></div>
    <div class="header-actions"><a href="/">← Scoreboard</a><a href="/setup.html">Settings</a><button id="reset-layout" type="button">Reset Layout</button><button id="refresh" type="button">Refresh</button></div>
  </header>
  <main class="page-shell">
    <section id="score" class="gc-score"></section>
    <section class="game-context-strip" id="context"></section>
    <p class="layout-hint">Drag a panel by its heading to arrange this MatchCenter. The layout is saved on this computer.</p>
    <section id="matchcenter-layout" class="gc-grid">
      <article class="panel draggable-panel" data-panel-id="away" draggable="true"><h2>Away Lineup <span class="drag-indicator" aria-hidden="true">⋮⋮</span></h2><div id="away"></div></article>
      <article class="panel draggable-panel" data-panel-id="timeline" draggable="true"><h2>Match Timeline <span class="drag-indicator" aria-hidden="true">⋮⋮</span></h2><div id="timeline" class="pitch-list"></div></article>
      <article class="panel draggable-panel" data-panel-id="home" draggable="true"><h2>Home Lineup <span class="drag-indicator" aria-hidden="true">⋮⋮</span></h2><div id="home"></div></article>
    </section>
    <section class="panel"><h2>Team Statistics</h2><div id="stats"></div></section>
  </main>
  <script src="/soccer-matchcenter.js?v=0.1.4"></script>
</body>
</html>
